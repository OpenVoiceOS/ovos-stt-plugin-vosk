name: License Check

on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  license_check:
    uses: OpenVoiceOS/gh-automations/.github/workflows/license-check.yml@dev
    secrets: inherit
    with:
      # tqdm's "MPL-2.0 AND MIT" is classified WeakCopyleft but its primary
      # license is MIT (permissive).
      exclude_packages: '^(tqdm).*'
      exclude_licenses: '^(Mozilla Public License|MPL).*'
